name: Validate ROBOTRAITS Ontology

on: push: paths: - "ontology/" - "docs/" - ".github/workflows/validate-ontology.yml" pullrequest: paths: - "ontology/" - "docs/" - ".github/workflows/validate-ontology.yml" workflowdispatch:

permissions: contents: read

jobs: validate: name: RDF, OWL, and SHACL Validation runs-on: ubuntu-latest

steps: - name: Check out repository uses: actions/checkout@v4

- name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.12"

- name: Install validation tools run: | python -m pip install --upgrade pip python -m pip install pyshacl rdflib owlrl

- name: Parse ontology files run: | python - <<'PY' from rdflib import Graph

files = [ "ontology/robotraits.ttl", "ontology/robotraits-shapes.ttl", "ontology/robotraits-example.ttl", ]

for path in files: graph = Graph() graph.parse(path, format="turtle") print(f"PASS: {path} ({len(graph)} triples)") PY

- name: Validate example data with SHACL run: | pyshacl
-s ontology/robotraits-shapes.ttl
-e ontology/robotraits.ttl
-i rdfs
ontology/robotraits-example.ttl

- name: Check ontology OWL profile run: | python - <<'PY' from rdflib import Graph, Namespace, RDF, OWL

graph = Graph() graph.parse("ontology/robotraits.ttl", format="turtle")

ontology = Namespace("https://w3id.org/robotraits/ontology/") declared = list(graph.subjects(RDF.type, OWL.Ontology))

if not declared: raise SystemExit("FAIL: No owl:Ontology declaration found")

print("PASS: Ontology declaration found") print(f"Ontology declarations: {len(declared)}") print( "Note: This check does not replace a dedicated " "OWL 2 DL profile validator or reasoner." ) PY
